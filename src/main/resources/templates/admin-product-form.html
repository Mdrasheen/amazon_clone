<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Product Form</title>
</head>
<body>

<h2 th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></h2>

<form th:action="@{/admin/products/save}" th:object="${product}" method="post">

    <input type="hidden" th:field="*{id}" />

    <label>Name:</label><br>
    <input type="text" th:field="*{name}" required><br><br>

    <label>Description:</label><br>
    <textarea th:field="*{description}" required></textarea><br><br>

    <label>Price:</label><br>
    <input type="number" step="0.01" th:field="*{price}" required><br><br>

    <label>Image URL:</label><br>
    <input type="text" th:field="*{imageUrl}" required><br><br>

    <button type="submit">Save</button>
</form>

<br>
<a href="/admin/products">⬅ Back to Products</a>

</body>
</html>
