<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>My Cart | Amazon Clone</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">
    <h2>Amazon Clone</h2>

    <div>
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/products}">Products</a>

        <form sec:authorize="isAuthenticated()"
              th:action="@{/logout}"
              method="post"
              style="display:inline;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button class="btn btn-danger">Logout</button>
        </form>
    </div>
</div>

<!-- ================= CONTENT ================= -->
<div class="container">

    <h1>Shopping Cart</h1>

    <!-- EMPTY CART -->
    <div class="card" th:if="${cart == null or cart.isEmpty()}">
        <p>Your cart is empty.</p>
        <br>
        <a th:href="@{/products}" class="btn btn-primary">
            Continue Shopping
        </a>
    </div>

    <!-- CART WITH ITEMS -->
    <div class="card" th:if="${cart != null and !cart.isEmpty()}">

        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="item : ${cart}">
                <td th:text="${item.product.name}"></td>
                <td>₹ <span th:text="${item.product.price}"></span></td>
                <td th:text="${item.quantity}"></td>
                <td>
                    ₹ <span th:text="${item.product.price * item.quantity}"></span>
                </td>
                <td>
                    <a th:href="@{/cart/remove/{id}(id=${item.product.id})}"
                       class="btn btn-danger">
                        Remove
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <br>

        <h2>
            Total Amount: ₹ <span th:text="${total}"></span>
        </h2>

        <br>

        <a th:href="@{/checkout}" class="btn btn-primary">
            Proceed to Checkout
        </a>

    </div>

</div>

<!-- ================= FOOTER ================= -->
<div class="footer">
    © 2026 Amazon Clone | Fast & Secure Checkout
</div>

</body>
</html>
