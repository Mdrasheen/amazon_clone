<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Details</title>
</head>
<body>

<h2>Order Details (Admin)</h2>

<a th:href="@{/admin/orders}">← Back to All Orders</a>
<hr>

<h3>Order Info</h3>
<p>
    <b>Order ID:</b> <span th:text="${order.id}"></span>
</p>
<p>
    <b>User Email:</b> <span th:text="${order.userEmail}"></span>
</p>
<p>
    <b>Order Date:</b> <span th:text="${order.orderDate}"></span>
</p>
<p>
    <b>Total Amount:</b> ₹<span th:text="${order.totalAmount}"></span>
</p>

<p>
    <b>Order Status:</b>
    <span th:text="${order.status}"></span>
</p>

<p>
    <b>Payment Method:</b>
    <span th:text="${order.paymentMethod}"></span>
</p>

<p>
    <b>Payment Status:</b>
    <span th:text="${order.paymentStatus}"></span>
</p>

<hr>

<h3>Ordered Items</h3>

<table border="1" cellpadding="10">
    <tr>
        <th>Product Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
    </tr>

    <tr th:each="item : ${order.orderItems}">
        <td th:text="${item.productName}"></td>
        <td>₹<span th:text="${item.price}"></span></td>
        <td th:text="${item.quantity}"></td>
        <td>
            ₹<span th:text="${item.price * item.quantity}"></span>
        </td>
    </tr>
</table>

<hr>

<h3>Update Order Status</h3>

<form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
    <select name="status">
        <option th:selected="${order.status == 'PLACED'}">PLACED</option>
        <option th:selected="${order.status == 'SHIPPED'}">SHIPPED</option>
        <option th:selected="${order.status == 'DELIVERED'}">DELIVERED</option>
        <option th:selected="${order.status == 'CANCELLED'}">CANCELLED</option>
    </select>

    <button type="submit">Update Status</button>

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />
</form>

</body>
</html>
