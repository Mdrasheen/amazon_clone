<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Orders</title>
</head>
<body>

<h2>All Orders</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Order ID</th>
        <th>User Email</th>
        <th>Order Date</th>
        <th>Total Amount</th>
        <th>Status</th>
        <th>View</th>
        <th>Update Status</th>
    </tr>

    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.userEmail}"></td>
        <td th:text="${order.orderDate}"></td>
        <td>₹<span th:text="${order.totalAmount}"></span></td>
        <td th:text="${order.status}"></td>

        <!-- View order details -->
        <td>
            <a th:href="@{/admin/orders/{id}(id=${order.id})}">View</a>
        </td>

        <!-- Update order status -->
        <td>
            <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">

                <select name="status">
                    <option value="PLACED"
                        th:selected="${order.status == 'PLACED'}">
                        PLACED
                    </option>

                    <option value="SHIPPED"
                        th:selected="${order.status == 'SHIPPED'}">
                        SHIPPED
                    </option>

                    <option value="DELIVERED"
                        th:selected="${order.status == 'DELIVERED'}">
                        DELIVERED
                    </option>

                    <option value="CANCELLED"
                        th:selected="${order.status == 'CANCELLED'}">
                        CANCELLED
                    </option>
                </select>

                <button type="submit">Update</button>

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />
            </form>
        </td>
    </tr>
</table>

<br>

<a th:href="@{/home}">← Back to Home</a>

</body>
</html>
