<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h2>My Orders</h2>

    <div th:if="${orders.isEmpty()}" class="card">
        <p>No orders found.</p>
    </div>

    <div th:each="order : ${orders}" class="card">

        <h3>Order #<span th:text="${order.id}"></span></h3>

        <p><b>Date:</b> <span th:text="${order.orderDate}"></span></p>
        <p><b>Total:</b> ₹<span th:text="${order.totalAmount}"></span></p>

        <p>
            <b>Status:</b>
            <span class="badge"
                  th:classappend="' badge-' + ${order.status}"
                  th:text="${order.status}">
            </span>
        </p>

        <p>
            <b>Payment:</b>
            <span th:text="${order.paymentMethod}"></span>
            (<span th:text="${order.paymentStatus}"></span>)
        </p>

    </div>

</div>

</body>
</html>
