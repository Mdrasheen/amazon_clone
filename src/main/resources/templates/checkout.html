<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Checkout | Amazon Clone</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">
    <h2>Amazon Clone</h2>

    <div>
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/cart}">Cart</a>

        <form sec:authorize="isAuthenticated()"
              th:action="@{/logout}"
              method="post"
              style="display:inline;">
            <button class="btn btn-danger">Logout</button>
        </form>
    </div>
</div>

<!-- ================= CONTENT ================= -->
<div class="container">

    <h1>Checkout</h1>

    <!-- ORDER SUMMARY -->
    <div class="card">
        <h2>Order Summary</h2>

        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="item : ${cart}">
                <td th:text="${item.product.name}"></td>
                <td>₹ <span th:text="${item.product.price}"></span></td>
                <td th:text="${item.quantity}"></td>
                <td>
                    ₹ <span th:text="${item.product.price * item.quantity}"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <h2 style="margin-top:20px;">
            Total Amount: ₹ <span th:text="${total}"></span>
        </h2>
    </div>

    <!-- PAYMENT METHOD -->
    <div class="card">
        <h2>Select Payment Method</h2>

        <form th:action="@{/checkout}" method="post">

            <div class="form-group">
                <label>
                    <input type="radio" name="paymentMethod" value="COD" required>
                    Cash on Delivery
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="radio" name="paymentMethod" value="UPI">
                    UPI
                </label>
            </div>

            <div class="form-group">
                <label>
                    <input type="radio" name="paymentMethod" value="NET_BANKING">
                    Net Banking
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:15px;">
                Place Order
            </button>

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
        </form>
    </div>

</div>

<!-- ================= FOOTER ================= -->
<div class="footer">
    © 2026 Amazon Clone | Secure Payments
</div>

</body>
</html>
